<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Жоним, тебе письмо 💌</title>
<meta name="description" content="Приглашение на свидание">
<meta property="og:title" content="Жоним, тебе письмо 💌">
<meta property="og:description" content="Открой конверт — внутри кое-что важное.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Onest:wght@400;500;600&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFF4EA; --card:#FFFBF6; --ink:#2A1B21; --ink-soft:#7A626B;
  --cherry:#C9264E; --cherry-dark:#A81238; --line:#EBD8CB;
  --display:'Unbounded','Onest',system-ui,sans-serif;
  --hand:'Caveat','Onest',cursive;
  --body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  font-family:var(--body); color:var(--ink); background:var(--paper);
  background-image:
    radial-gradient(60% 45% at 12% 0%, rgba(255,201,212,.75), transparent 60%),
    radial-gradient(50% 40% at 100% 6%, rgba(242,179,61,.35), transparent 65%),
    radial-gradient(70% 50% at 50% 110%, rgba(255,201,212,.55), transparent 60%);
  background-attachment:fixed; min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  padding:28px 20px; -webkit-font-smoothing:antialiased;
}
.stage{width:100%;max-width:520px;text-align:center}
.step{display:none;animation:fade .5s ease both}
.step.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* конверт */
.envelope{
  position:relative;width:min(340px,78vw);aspect-ratio:1.5/1;margin:0 auto;cursor:pointer;
  filter:drop-shadow(0 30px 40px rgba(120,60,70,.28));animation:bob 5s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-12px) rotate(1.5deg)}}
.env-body{position:absolute;inset:0;background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.env-body::before,.env-body::after{content:'';position:absolute;width:150%;height:1px;background:var(--line);top:50%;left:-25%;transform-origin:center}
.env-body::before{transform:rotate(33deg)}
.env-body::after{transform:rotate(-33deg)}
.env-flap{
  position:absolute;top:0;left:0;right:0;height:62%;
  background:linear-gradient(175deg,#FFE9DA,#FFDCC9);
  clip-path:polygon(0 0,100% 0,50% 100%);border-radius:14px 14px 0 0;
  transform-origin:top center;transition:transform .7s cubic-bezier(.4,1.3,.5,1);z-index:3;
}
.seal{
  position:absolute;left:50%;top:52%;width:64px;height:64px;margin:-32px 0 0 -32px;z-index:4;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#E0456B,var(--cherry-dark) 70%);
  box-shadow:inset 0 -4px 8px rgba(0,0,0,.28),0 6px 14px rgba(168,18,56,.4);
  display:grid;place-items:center;color:#FFD9E1;font-size:26px;
  transition:opacity .3s ease,transform .5s ease;
}
.envelope.open .env-flap{transform:rotateX(180deg)}
.envelope.open .seal{opacity:0;transform:scale(.4) rotate(40deg)}
.hint{margin-top:26px;font-size:14px;color:var(--ink-soft)}

/* письмо */
.letter{
  background:var(--card);border-radius:18px;border:1px solid var(--line);
  padding:30px 26px 26px;position:relative;overflow:hidden;text-align:left;
  box-shadow:0 26px 50px -30px rgba(120,60,70,.55);
}
.letter::after{content:'';position:absolute;inset:10px;border:1px dashed rgba(201,38,78,.22);border-radius:12px;pointer-events:none}
.to{font-family:var(--hand);font-size:30px;color:var(--cherry);line-height:1.1}
.big{font-family:var(--display);font-weight:800;font-size:clamp(22px,5.6vw,32px);line-height:1.08;margin:14px 0 18px;letter-spacing:-.02em}
.rows{border-top:1px solid var(--line);margin-top:4px}
.row{display:flex;gap:14px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line)}
.row .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);width:76px;flex:none}
.row .v{font-size:17px;font-weight:500;line-height:1.35}
.note{font-family:var(--hand);font-size:25px;line-height:1.35;margin-top:20px;white-space:pre-wrap}
.sign{font-family:var(--hand);font-size:26px;color:var(--cherry);text-align:right;margin-top:18px}
.stamp{
  position:absolute;top:16px;right:16px;width:78px;height:78px;border-radius:50%;
  border:2px solid rgba(201,38,78,.4);color:var(--cherry);display:grid;place-items:center;text-align:center;
  font-size:9px;line-height:1.3;letter-spacing:.08em;text-transform:uppercase;transform:rotate(11deg);
  opacity:.8;font-weight:600;padding:6px;
}
.stamp b{display:block;font-size:22px;letter-spacing:0}

/* кнопки */
.answers{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:26px;flex-wrap:wrap;min-height:70px}
.btn{
  font-family:var(--display);font-weight:700;font-size:16px;border:0;border-radius:999px;padding:17px 30px;cursor:pointer;
  background:var(--cherry);color:#fff;box-shadow:0 12px 26px -12px rgba(168,18,56,.85);
  transition:transform .18s ease,background .18s ease;display:inline-flex;align-items:center;gap:10px;
}
.btn:hover{transform:translateY(-2px);background:var(--cherry-dark)}
.btn.ghost{background:#FFFBF6;color:var(--ink);box-shadow:0 6px 18px -10px rgba(120,60,70,.6);border:1.5px solid var(--line)}
#btn-no{transition:left .3s cubic-bezier(.34,1.4,.64,1), top .3s cubic-bezier(.34,1.4,.64,1);z-index:40;touch-action:none}
#btn-no.loose{position:fixed;margin:0}
:focus-visible{outline:3px solid var(--cherry);outline-offset:3px;border-radius:14px}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,7vw,38px);letter-spacing:-.02em;margin:0}
.lead{color:var(--ink-soft);font-size:16px;line-height:1.5;margin:14px auto 0;max-width:34ch}
.small{font-size:13px;color:var(--ink-soft);margin-top:14px;min-height:20px}
.hearts{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.heart{position:absolute;bottom:-40px;animation:rise 2.6s ease-in forwards}
@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translateY(-90vh) scale(1.2) rotate(30deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.envelope{animation:none}}
</style>
</head>
<body>

<div class="stage">

  <section class="step on" id="s-env">
    <div class="envelope" id="env" role="button" tabindex="0" aria-label="Открыть письмо">
      <div class="env-body"></div>
      <div class="env-flap"></div>
      <div class="seal">🐾</div>
    </div>
    <p class="hint">нажми на конверт</p>
  </section>

  <section class="step" id="s-letter">
    <div class="letter" id="card"></div>
    <div class="answers">
      <button class="btn" id="btn-yes">Да, согласна ❤️</button>
      <button class="btn ghost" id="btn-no" aria-label="Эта кнопка убегает">Не смогу</button>
    </div>
    <p class="small" id="nope">&nbsp;</p>
  </section>

  <section class="step" id="s-done">
    <h2 id="d-title"></h2>
    <p class="lead" id="d-text"></p>
    <p style="margin-top:26px"><button class="btn" id="d-back">Перечитать письмо</button></p>
  </section>

</div>
<div class="hearts" id="hearts"></div>

<script>
/* ==========  МЕНЯТЬ ЗДЕСЬ  ========== */
var INVITE = {
  to:    "Жоним",
  what:  "свидание с вашим котиком",
  when:  "В любой удобный вам день",
  time:  "Когда соскучитесь",
  place: "Там, где Чирчик объединяется с Ташкентом",
  note:  "Уделите мне немного вашей любви и времени <3",
  from:  "твой Котик"
};
/* ==================================== */

(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };

  function step(id){
    var all = document.querySelectorAll(".step");
    for (var i=0;i<all.length;i++) all[i].classList.remove("on");
    $(id).classList.add("on");
  }
  function esc(s){
    return String(s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});
  }

  /* ---- письмо ---- */
  var d = INVITE, rows = "";
  if (d.when)  rows += '<div class="row"><div class="k">когда</div><div class="v">'+esc(d.when)+'</div></div>';
  if (d.time)  rows += '<div class="row"><div class="k">во сколько</div><div class="v">'+esc(d.time)+'</div></div>';
  if (d.place) rows += '<div class="row"><div class="k">где</div><div class="v">'+esc(d.place)+'</div></div>';

  $("#card").innerHTML =
    '<div class="stamp">свидание<b>🐱</b>с котиком</div>' +
    '<div class="to">'+esc(d.to)+',</div>' +
    '<div class="big">зову тебя<br>на '+esc(d.what)+'</div>' +
    '<div class="rows">'+rows+'</div>' +
    (d.note ? '<div class="note">'+esc(d.note)+'</div>' : "") +
    (d.from ? '<div class="sign">'+esc(d.from)+'</div>' : "");

  /* ---- конверт ---- */
  function openEnv(){
    var env = $("#env");
    if (env.classList.contains("open")) return;
    env.classList.add("open");
    setTimeout(function(){ step("#s-letter"); }, 780);
  }
  $("#env").addEventListener("click", openEnv);
  $("#env").addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openEnv(); }
  });

  /* ---- убегающая кнопка ---- */
  var no = $("#btn-no");
  var loose = false;
  var msgs = ["мимо 🙂","не поймаешь","она стесняется","попробуй ещё","ну куда ты","эта кнопка не работает","сдавайся ❤️"];
  var msgI = 0;

  function jump(){
    var w = window.innerWidth, h = window.innerHeight;
    var bw = no.offsetWidth || 150, bh = no.offsetHeight || 54;
    if (!loose){
      var r = no.getBoundingClientRect();
      no.style.left = r.left + "px";
      no.style.top = r.top + "px";
      no.classList.add("loose");
      loose = true;
      no.offsetHeight; // reflow, чтобы анимация сработала
    }
    var pad = 12;
    var x = pad + Math.random() * Math.max(1, w - bw - pad*2);
    var y = pad + Math.random() * Math.max(1, h - bh - pad*2);
    no.style.left = Math.round(x) + "px";
    no.style.top = Math.round(y) + "px";
    $("#nope").textContent = msgs[msgI % msgs.length];
    msgI++;
  }

  // мышь: убегает при наведении и при приближении курсора
  no.addEventListener("mouseenter", jump);
  document.addEventListener("mousemove", function(e){
    if ($("#s-letter").classList.contains("on") === false) return;
    var r = no.getBoundingClientRect();
    var cx = r.left + r.width/2, cy = r.top + r.height/2;
    if (Math.hypot(e.clientX - cx, e.clientY - cy) < 90) jump();
  });

  // палец: уезжает раньше, чем сработает нажатие
  no.addEventListener("touchstart", function(e){ e.preventDefault(); jump(); }, { passive:false });
  no.addEventListener("pointerdown", function(e){ e.preventDefault(); jump(); });
  no.addEventListener("focus", jump);
  no.addEventListener("click", function(e){ e.preventDefault(); jump(); });

  window.addEventListener("resize", function(){
    if (!loose) return;
    var r = no.getBoundingClientRect();
    if (r.right > window.innerWidth || r.bottom > window.innerHeight) jump();
  });

  /* ---- да ---- */
  function hearts(){
    var box = $("#hearts"), chars = ["❤️","🐾","💗","✨","🐱"];
    for (var i=0;i<28;i++){
      setTimeout(function(){
        var el = document.createElement("span");
        el.className = "heart";
        el.textContent = chars[Math.floor(Math.random()*chars.length)];
        el.style.left = (Math.random()*100) + "vw";
        el.style.fontSize = (16 + Math.random()*22) + "px";
        box.appendChild(el);
        setTimeout(function(){ el.remove(); }, 2800);
      }, i*80);
    }
  }
  $("#btn-yes").addEventListener("click", function(){
    hearts();
    no.classList.remove("loose");
    no.style.left = ""; no.style.top = ""; loose = false;
    $("#d-title").textContent = "Договорились ❤️";
    $("#d-text").textContent = d.when + ", " + d.time.toLowerCase() + ". " + d.place + ". Котик уже ждёт.";
    step("#s-done");
  });
  $("#d-back").addEventListener("click", function(){ step("#s-letter"); });
})();
</script>
</body>
</html>
